<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Max &amp; Moew Moew</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <div class="paper">
    <span class="tape tape-left" aria-hidden="true"></span>
    <span class="tape tape-right" aria-hidden="true"></span>
    <span class="tape tape-side" aria-hidden="true"></span>

    <div class="deco deco-flower" aria-hidden="true">
      <svg viewBox="0 0 120 200" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M62 198 C59 154 55 122 53 94" />
        <path d="M56 150 C38 142 28 126 26 108" />
        <path d="M57 128 C74 122 84 108 86 92" />
        <path d="M53 106 C40 100 33 88 32 76" />
        <ellipse cx="38" cy="72" rx="9" ry="5" transform="rotate(-24 38 72)" />
        <ellipse cx="48" cy="60" rx="10" ry="5" transform="rotate(12 48 60)" />
        <ellipse cx="62" cy="54" rx="10" ry="5" transform="rotate(-6 62 54)" />
        <ellipse cx="74" cy="62" rx="9" ry="5" transform="rotate(28 74 62)" />
        <ellipse cx="66" cy="72" rx="8" ry="4.5" transform="rotate(-40 66 72)" />
        <circle cx="56" cy="64" r="4" />
        <ellipse cx="23" cy="104" rx="7" ry="3.5" transform="rotate(40 23 104)" />
        <ellipse cx="88" cy="88" rx="7" ry="3.5" transform="rotate(-30 88 88)" />
        <ellipse cx="31" cy="154" rx="7" ry="3.5" transform="rotate(-58 31 154)" />
      </svg>
    </div>

    <div class="deco deco-flower deco-flower-low" aria-hidden="true">
      <svg viewBox="0 0 120 200" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M62 198 C59 154 55 122 53 94" />
        <path d="M56 150 C38 142 28 126 26 108" />
        <path d="M57 128 C74 122 84 108 86 92" />
        <path d="M53 106 C40 100 33 88 32 76" />
        <ellipse cx="38" cy="72" rx="9" ry="5" transform="rotate(-24 38 72)" />
        <ellipse cx="48" cy="60" rx="10" ry="5" transform="rotate(12 48 60)" />
        <ellipse cx="62" cy="54" rx="10" ry="5" transform="rotate(-6 62 54)" />
        <ellipse cx="74" cy="62" rx="9" ry="5" transform="rotate(28 74 62)" />
        <ellipse cx="66" cy="72" rx="8" ry="4.5" transform="rotate(-40 66 72)" />
        <circle cx="56" cy="64" r="4" />
        <ellipse cx="23" cy="104" rx="7" ry="3.5" transform="rotate(40 23 104)" />
        <ellipse cx="88" cy="88" rx="7" ry="3.5" transform="rotate(-30 88 88)" />
        <ellipse cx="31" cy="154" rx="7" ry="3.5" transform="rotate(-58 31 154)" />
      </svg>
    </div>

    <div class="deco deco-postmark" aria-hidden="true">
      <svg viewBox="0 0 140 140" fill="none" stroke="currentColor">
        <circle cx="70" cy="70" r="57" stroke-width="2" stroke-dasharray="4 5" />
        <circle cx="70" cy="70" r="45" stroke-width="1" />
        <circle cx="70" cy="70" r="18" stroke-width="1" />
        <text x="70" y="52" text-anchor="middle" font-size="9" letter-spacing="3">OUR LOVE</text>
        <text x="70" y="94" text-anchor="middle" font-size="9" font-family="Courier New, monospace">2026</text>
        <path d="M62 70 h16 M70 62 v16" stroke-width="1" />
      </svg>
    </div>

    <div class="deco deco-stamp" aria-hidden="true">
      <div class="stamp-inner">
        <span class="stamp-flower">&#10048;</span>
        <span class="stamp-year">2026</span>
      </div>
    </div>

    <header class="site-header">
      <p class="masthead">OUR LITTLE SCRAPBOOK &middot; LONDON / WUHAN</p>
      <h1 class="site-title">
        <span class="title-emoji">&#129418;</span>
        <span>Max &amp; Moew Moew</span>
        <span class="title-emoji">&#128049;</span>
      </h1>
      <p class="site-sub">Strawberry fields forever</p>
      <nav class="topbar">
        <div class="topbar-inner">
          <button class="main-tab active" data-view="gallery">沙龙</button>
          <button class="main-tab" data-view="messages">留言板</button>
        </div>
      </nav>
    </header>

  <main class="container">
    <section class="view" id="view-gallery">
      <div class="gallery-toolbar">
        <div class="compose-wrap">
          <svg class="hand-arrow" viewBox="0 0 90 50" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 41 C 24 43, 52 35, 67 17" />
            <path d="M57 17 L 68 15 L 63 26" />
          </svg>
          <button class="compose-btn" id="compose-open">+ 记录</button>
        </div>
      </div>
      <section class="gallery" id="gallery">
      </section>
    </section>

    <section class="view" id="view-messages" hidden>
      <section class="message-section" id="message-section">
        <div class="message-head">
          <span class="message-head-note">· 写给对方的</span>
        </div>

        <div class="message-compose" id="message-compose">
          <textarea
            id="message-input"
            class="message-input"
            rows="1"
            placeholder="写下你想说的话..."
            maxlength="1500"
          ></textarea>
          <div class="compose-toolbar">
            <span class="compose-count" id="message-count">0/1500</span>
            <span class="compose-hint">⌘ + Enter</span>
            <button class="send-btn" id="send-btn">寄出</button>
          </div>
        </div>

        <ul class="message-list" id="message-list">
        </ul>
      </section>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-seal" aria-hidden="true">M&amp;M</div>
    <p>made for Max &amp; Moew Moew</p>
  </footer>
  </div>

  <a class="playlist-fab" href="https://m.kugou.com/songlist/gcid_3z1esi2dfz3z085/?src_cid=3z1esi2dfz3z085&amp;uid=2616364045&amp;chl=wechat&amp;iszlist=1" target="_blank" rel="noopener" aria-label="打开我们的歌单" title="我们的歌单">
    <span class="playlist-fab-label" aria-hidden="true">♫</span>
  </a>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-carousel" id="modal-carousel">
        <div class="modal-track" id="modal-track"></div>
        <button class="modal-arrow modal-prev" id="modal-prev">&#10094;</button>
        <button class="modal-arrow modal-next" id="modal-next">&#10095;</button>
        <div class="modal-dots" id="modal-dots"></div>
      </div>
      <div class="modal-body">
        <span class="modal-tag" id="modal-tag"></span>
        <span class="modal-date" id="modal-date"></span>
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-text" id="modal-text"></p>
        <div class="modal-actions">
          <button class="modal-action" id="modal-edit">编辑</button>
          <button class="modal-action modal-action-danger" id="modal-delete">删除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="compose-modal">
    <div class="modal-content compose-content">
      <button class="modal-close" id="compose-close">&times;</button>
      <div class="compose-body">
        <h2 class="compose-title" id="compose-heading">记录这一刻</h2>

        <label class="field-label" for="compose-title">标题</label>
        <input type="text" id="compose-title" class="compose-field" maxlength="60" placeholder="给这段记忆起个名字">

        <label class="field-label" for="compose-excerpt">缩略语（选填）</label>
        <input type="text" id="compose-excerpt" class="compose-field" maxlength="40" placeholder="用一句话概括这段记忆">

        <label class="field-label" for="compose-date">日期（选填）</label>
        <input type="date" id="compose-date" class="compose-field">

        <label class="field-label" for="compose-text">文字</label>
        <textarea id="compose-text" class="compose-field compose-textarea" rows="6" maxlength="2000" placeholder="写下这一刻..."></textarea>

        <label class="field-label" for="compose-category">分类</label>
        <select id="compose-category" class="compose-field compose-select">
          <option value="uk">英国</option>
          <option value="wuhan">武汉</option>
        </select>

        <div id="compose-images-area">
          <label class="field-label" for="compose-images">图片（可多选，拖动缩略图可排序）</label>
          <input type="file" id="compose-images" class="compose-file" accept="image/*" multiple>
          <div class="compose-previews" id="compose-previews"></div>
          <p class="compose-progress" id="compose-progress" hidden></p>
        </div>

        <button class="compose-submit" id="compose-submit">发布</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script src="extras.js"></script>
</body>
</html>
